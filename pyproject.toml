[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-from-scratch"
version = "0.1.0"
authors = [{ name = "Hoàng Mạnh Đức" }]
description = "Machine Learning algorithms implemented from scratch in pure NumPy"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "matplotlib",
    "scikit-learn"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["utils*", "algorithms*"]